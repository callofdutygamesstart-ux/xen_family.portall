    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Vazirmatn', 'sans-serif'],
                        gaming: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        xen: {
                            cyan: '#00f0ff',
                            purple: '#7000ff',
                            pink: '#ff007f',
                            rubika: '#a824e4',
                            telegram: '#0088cc',
                            dark: '#06080d',
                            card: 'rgba(12, 16, 28, 0.75)'
                        }
                    },
                    animation: {
                        'gradient-x': 'gradient-x 6s ease infinite',
                        'pulse-glow': 'pulse-glow 2.5s infinite',
                        'float': 'float 4s ease-in-out infinite',
                        'card-appear': 'cardAppear 0.5s ease-out forwards'
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },

                        'pulse-glow': {
                            '0%, 100%': { opacity: '1', filter: 'drop-shadow(0 0 15px rgba(0, 240, 255, 0.6))' },

                        'float': {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }

                        'cardAppear': {
                            '0%': { opacity: '0', transform: 'scale(0.92) translateY(15px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' }

                    }
                }
            }
        }

    <style>
        /* Strict Mobile Overflow Protection */
        html, body {
            max-width: 100vw;
            overflow-x: hidden !important;
            position: relative;
            background-color: #05070c;
            color: #ffffff;
            touch-action: manipulation;
            font-family: 'Vazirmatn', sans-serif;
        }

        /* Cyber Glassmorphic Panel */
        .glass-panel {
            background: rgba(12, 16, 28, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.7), inset 0 0 1px rgba(255, 255, 255, 0.2);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25) 0%, rgba(112, 0, 255, 0.35) 50%, rgba(255, 0, 127, 0.3) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 240, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-btn:hover {
            border-color: rgba(255, 0, 127, 0.9);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(255, 0, 127, 0.4);
            transform: translateY(-3px) scale(1.01);
        }

        .glass-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        .animated-gradient-text {
            background: linear-gradient(-45deg, #00f0ff, #7000ff, #ff007f, #00f0ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradient-x 6s ease infinite;
        }

        .messenger-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .messenger-btn.active-telegram {
            border-color: #0088cc !important;
            background: rgba(0, 136, 204, 0.2) !important;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.4);
        }

        .messenger-btn.active-rubika {
            border-color: #a824e4 !important;
            background: rgba(168, 36, 228, 0.2) !important;
            box-shadow: 0 0 15px rgba(168, 36, 228, 0.4);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #05070c;
        }
        ::-webkit-scrollbar-thumb {
            background: #7000ff;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00f0ff;
        }

        /* Rubika SVG Icon */
        .rubika-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            display: inline-block;
        }
    </style>
</head>

    <!-- Main Script Code -->
    <script>
        // Supabase Database Connection Setup
        const SUPABASE_URL = "https://jrehjxsdmdfwkprdfyvt.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_Sa8VoD30bdM6WMpPKHMkxg_VrTPHAee";
        
        let _supabase = null;
        try {
            _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("خطا در اتصال به Supabase:", err);
        }

        let applicationsList = [];
        let activeAdminTab = 'new';

        // Select Messenger Platform (Telegram / Rubika)
        function selectMessenger(platform) {
            document.getElementById('applicantMessenger').value = platform;
            
            const btnTelegram = document.getElementById('btn-msg-telegram');
            const btnRubika = document.getElementById('btn-msg-rubika');
            const label = document.getElementById('messengerIdLabel');
            const input = document.getElementById('applicantTelegram');

            if (platform === 'telegram') {
                btnTelegram.className = 'messenger-btn active-telegram bg-black/40 border border-white/10 rounded-xl py-3 px-3 text-xs font-bold text-white flex items-center justify-center gap-2';
                btnRubika.className = 'messenger-btn bg-black/40 border border-white/10 rounded-xl py-3 px-3 text-xs font-bold text-gray-300 flex items-center justify-center gap-2';
                label.innerHTML = '<i class="fab fa-telegram text-xen-telegram ml-1"></i> آیدی تلگرام خود را وارد کنید';
                label.className = 'block text-xs font-bold text-xen-cyan mb-1.5 pr-1 transition-all';
                input.placeholder = '@username';
                input.focus();
            } else {
                btnRubika.className = 'messenger-btn active-rubika bg-black/40 border border-white/10 rounded-xl py-3 px-3 text-xs font-bold text-white flex items-center justify-center gap-2';
                btnTelegram.className = 'messenger-btn bg-black/40 border border-white/10 rounded-xl py-3 px-3 text-xs font-bold text-gray-300 flex items-center justify-center gap-2';
                label.innerHTML = '<i class="fas fa-at text-xen-rubika ml-1"></i> آیدی روبیکا خود را وارد کنید';
                label.className = 'block text-xs font-bold text-xen-rubika mb-1.5 pr-1 transition-all';
                input.placeholder = '@rubika_id';
                input.focus();
            }
        }

        // Select Device Type
        function selectDevice(deviceType) {
            document.getElementById('applicantDevice').value = deviceType;
            
            document.querySelectorAll('.device-btn').forEach(btn => {
                btn.classList.remove('border-xen-cyan', 'bg-xen-cyan/20', 'text-xen-cyan');
            });
            
            const activeBtn = document.getElementById(`btn-device-${deviceType}`);
            if (activeBtn) {
                activeBtn.classList.add('border-xen-cyan', 'bg-xen-cyan/20', 'text-xen-cyan');
            }

            const phoneContainer = document.getElementById('phoneModelContainer');
            const phoneInput = document.getElementById('applicantPhoneModel');
            
            if (deviceType === 'Android' || deviceType === 'iOS') {
                phoneContainer.classList.remove('hidden');
                phoneInput.setAttribute('required', 'true');
            } else {
                phoneContainer.classList.add('hidden');
                phoneInput.removeAttribute('required');
                phoneInput.value = '';
            }
        }

        // Form Submission Handler
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const name = document.getElementById('applicantName').value.trim();
            const age = document.getElementById('applicantAge').value.trim();
            const level = document.getElementById('applicantLevel').value.trim();
            const messenger = document.getElementById('applicantMessenger').value;
            let messengerId = document.getElementById('applicantTelegram').value.trim();
            const device = document.getElementById('applicantDevice').value;
            const phoneModel = document.getElementById('applicantPhoneModel').value.trim();

            if (!device) {
                showToast('خطا در ثبت', 'لطفاً نوع دیوایس خود را انتخاب کنید.', 'fa-exclamation-triangle');
                return;
            }

            if (parseInt(level) > 500) {
                showToast('خطا در مقدار لول', 'حداکثر لول مجاز ۵۰۰ می‌باشد.', 'fa-exclamation-triangle');
                return;
            }

            if (!messengerId.startsWith('@')) {
                messengerId = '@' + messengerId;
            }

            // Standardize format to store platform along with ID without database schema changes
            const formattedTelegramField = messenger === 'rubika' ? `[روبیکا] ${messengerId}` : messengerId;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>در حال ثبت اطلاعات...</span>';

            const payload = {
                name: name,
                age: age,
                level: level,
                telegram: formattedTelegramField,
                device: device,
                model: (device === 'Android' || device === 'iOS') ? phoneModel : 'PC',
                status: 'new'
            };

            try {
                if (_supabase) {
                    const { data, error } = await _supabase.from('recruits').insert([payload]);
                    if (error) throw error;
                }
                
                showToast(
                    'درخواست با موفقیت ثبت شد 🎉',
                    `اطلاعات شما جهت تست در کلن XeN FAMILY ثبت گردید. منتظر پاسخ ادمین کلن در ${messenger === 'rubika' ? 'روبیکا' : 'تلگرام'} باشید.`,
                    'fa-check-circle text-green-400'
                );

                document.getElementById('clanApplyForm').reset();
                selectMessenger('telegram');
                selectDevice('PC');

            } catch (err) {
                console.error("Submit Error:", err);
                showToast('خطا در برقراری ارتباط', 'متأسفانه در ثبت اطلاعات خطایی رخ داد. مجدداً تلاش کنید.', 'fa-times-circle text-red-500');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>ارسال اطلاعات درخواست</span> <i class="fas fa-paper-plane text-xen-cyan"></i>';
            }
        }

        // Toast Modal Handler
        function showToast(title, message, iconClass) {
            document.getElementById('toastTitle').innerText = title;
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').className = `text-4xl mb-2 fas ${iconClass}`;
            document.getElementById('toastModal').classList.remove('hidden');
        }

        function closeToast() {
            document.getElementById('toastModal').classList.add('hidden');
        }

        // Admin Auth Flow
        function openAdminAuthModal() {
            document.getElementById('adminAuthModal').classList.remove('hidden');
            document.getElementById('adminPasswordInput').focus();
        }

        function closeAdminAuthModal() {
            document.getElementById('adminAuthModal').classList.add('hidden');
            document.getElementById('adminPasswordInput').value = '';
        }

        function verifyAdminPassword() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === 'Hahbsisjjsjsjsbsb71626') {
                closeAdminAuthModal();
                document.getElementById('adminDashboardModal').classList.remove('hidden');
                fetchApplications();
            } else {
                alert('رمز عبور مدیریت اشتباه است!');
            }
        }

        function closeAdminDashboard() {
            document.getElementById('adminDashboardModal').classList.hidden = true;
            document.getElementById('adminDashboardModal').classList.add('hidden');
        }

        // Fetch Data from Supabase
        async function fetchApplications() {
            const container = document.getElementById('adminRequestsList');
            container.innerHTML = '<div class="text-center py-10 text-xen-cyan"><i class="fas fa-circle-notch fa-spin text-3xl"></i><p class="mt-2 text-xs">در حال دریافت داده‌ها از دیتابیس...</p></div>';

            try {
                if (_supabase) {
                    const { data, error } = await _supabase
                        .from('recruits')
                        .select('*')
                        .order('created_at', { ascending: false });

                    if (error) throw error;
                    applicationsList = data || [];
                }
                renderAdminList();
            } catch (err) {
                console.error("Error Fetching Data:", err);
                container.innerHTML = '<div class="text-center py-8 text-red-400 text-xs"><i class="fas fa-exclamation-triangle text-2xl mb-2"></i><p>خطا در دریافت اطلاعات دیتابیس.</p></div>';
            }
        }

        function switchAdminTab(tab) {
            activeAdminTab = tab;
            const tabNewBtn = document.getElementById('tabNewBtn');
            const tabReviewedBtn = document.getElementById('tabReviewedBtn');

            if (tab === 'new') {
                tabNewBtn.className = 'flex-1 py-3 text-xs font-bold border-b-2 border-xen-cyan text-xen-cyan flex items-center justify-center gap-2 transition-all';
                tabReviewedBtn.className = 'flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center justify-center gap-2 transition-all';
            } else {
                tabReviewedBtn.className = 'flex-1 py-3 text-xs font-bold border-b-2 border-xen-purple text-xen-purple flex items-center justify-center gap-2 transition-all';
                tabNewBtn.className = 'flex-1 py-3 text-xs font-bold border-b-2 border-transparent text-gray-400 hover:text-gray-200 flex items-center justify-center gap-2 transition-all';
            }
            renderAdminList();
        }

        function renderAdminList() {
            const container = document.getElementById('adminRequestsList');
            
            const newRequests = applicationsList.filter(item => item.status === 'new' || !item.status);
            const reviewedRequests = applicationsList.filter(item => item.status === 'reviewed');

            document.getElementById('badgeNewCount').innerText = newRequests.length;
            document.getElementById('badgeReviewedCount').innerText = reviewedRequests.length;

            const currentList = activeAdminTab === 'new' ? newRequests : reviewedRequests;

            if (currentList.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-2 opacity-50"></i>
                        <p class="text-xs font-bold">هیچ درخواستی در این بخش موجود نیست.</p>
                    </div>`;
                return;
            }

            container.innerHTML = currentList.map(item => {
                const isRubika = item.telegram && item.telegram.includes('[روبیکا]');
                const cleanId = item.telegram ? item.telegram.replace('[روبیکا]', '').trim() : 'ثبت‌نشده';
                const appName = isRubika ? 'روبیکا' : 'تلگرام';
                const badgeColor = isRubika ? 'bg-xen-rubika/20 text-xen-rubika border-xen-rubika/40' : 'bg-xen-telegram/20 text-xen-telegram border-xen-telegram/40';

                return `
                    <div class="glass-panel p-4 rounded-2xl border-white/10 hover:border-xen-cyan/40 transition-all space-y-3 relative group animate-card-appear">
                        <div class="flex items-start justify-between border-b border-white/10 pb-2">
                            <div>
                                <h4 class="text-sm font-bold text-white flex items-center gap-2">
                                    <span>${escapeHtml(item.name || 'بدون نام')}</span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-normal border ${badgeColor}">
                                        ${appName}
                                    </span>
                                </h4>
                                <p class="text-[11px] text-gray-400 mt-0.5">آیدی ${appName}: <span class="text-xen-cyan font-mono" dir="ltr">${escapeHtml(cleanId)}</span></p>
                            </div>
                            <span class="text-[10px] font-gaming text-gray-500">${formatDate(item.created_at)}</span>
                        </div>

                        <div class="grid grid-cols-3 gap-2 text-center text-xs">
                            <div class="bg-black/30 rounded-lg p-1.5 border border-white/5">
                                <span class="block text-[10px] text-gray-400">سن</span>
                                <span class="font-bold text-white">${escapeHtml(String(item.age || '-'))} سال</span>
                            </div>
                            <div class="bg-black/30 rounded-lg p-1.5 border border-white/5">
                                <span class="block text-[10px] text-gray-400">لول</span>
                                <span class="font-bold text-yellow-400 font-gaming">${escapeHtml(String(item.level || '-'))}</span>
                            </div>
                            <div class="bg-black/30 rounded-lg p-1.5 border border-white/5">
                                <span class="block text-[10px] text-gray-400">دیوایس</span>
                                <span class="font-bold text-xen-cyan">${escapeHtml(item.device || 'PC')} ${item.model && item.model !== 'PC' ? `(${escapeHtml(item.model)})` : ''}</span>
                            </div>
                        </div>

                        <div class="flex items-center gap-2 pt-1">
                            <!-- Copy Formatted Text Button -->
                            <button onclick="copyFormattedApplicantInfo('${item.id}')" class="flex-1 bg-xen-cyan/15 hover:bg-xen-cyan/25 border border-xen-cyan/40 text-xen-cyan rounded-xl py-2 text-xs font-bold flex items-center justify-center gap-1.5 transition-all active:scale-95">
                                <i class="fas fa-copy"></i>
                                <span>کپی اطلاعات کاربر 📋</span>
                            </button>

                            ${activeAdminTab === 'new' ? `
                                <button onclick="toggleStatus('${item.id}', 'reviewed')" class="bg-green-500/20 hover:bg-green-500/30 border border-green-500/40 text-green-400 rounded-xl px-3 py-2 text-xs font-bold transition-all" title="تایید و انتقال به بررسی‌شده">
                                    <i class="fas fa-check"></i>
                                </button>
                            ` : `
                                <button onclick="toggleStatus('${item.id}', 'new')" class="bg-yellow-500/20 hover:bg-yellow-500/30 border border-yellow-500/40 text-yellow-400 rounded-xl px-3 py-2 text-xs font-bold transition-all" title="بازگردانی به جدیدها">
                                    <i class="fas fa-undo"></i>
                                </button>
                            `}

                            <button onclick="deleteApplicant('${item.id}')" class="bg-red-500/20 hover:bg-red-500/30 border border-red-500/40 text-red-400 rounded-xl px-3 py-2 text-xs font-bold transition-all" title="حذف درخواست">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Copy Formatted Information to Clipboard with Emojis
        function copyFormattedApplicantInfo(id) {
            const item = applicationsList.find(a => String(a.id) === String(id));
            if (!item) return;

            const isRubika = item.telegram && item.telegram.includes('[روبیکا]');
            const cleanId = item.telegram ? item.telegram.replace('[روبیکا]', '').trim() : 'ثبت‌نشده';
            const messengerName = isRubika ? '🟣 روبیکا' : '🔵 تلگرام';
            const deviceDetails = item.model && item.model !== 'PC' ? `${item.device} (${item.model})` : item.device || 'PC';
            const statusText = item.status === 'reviewed' ? '✅ بررسی‌شده' : '⏳ جدید';

            const formattedText = 
`🎮 ━━━━━━━━━━━━━━━━━━━
🔥 درخواست تست ورودی کلن XeN FAMILY
━━━━━━━━━━━━━━━━━━━
👤 نام: ${item.name || 'نامشخص'}
🎂 سن: ${item.age || '-'} سال
⭐ لول بازی: ${item.level || '-'}
📲 پیام‌رسان: ${messengerName}
🆔 آیدی: ${cleanId}
💻 دیوایس: ${deviceDetails}
📊 وضعیت: ${statusText}
━━━━━━━━━━━━━━━━━━━
✨ ثبت‌شده در پنل رسمی XeN TESTING`;

            // Compatibility copy function for clipboard
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(formattedText).then(() => {
                    alert('اطلاعات کامل کاربر با فرمت خفن و ایموجی در حافظه کپی شد! 📋🔥');
                }).catch(err => {
                    fallbackCopy(formattedText);
                });
            } else {
                fallbackCopy(formattedText);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert('اطلاعات کاربر با موفقیت کپی شد! 📋🔥');
            } catch (err) {
                alert('خطا در کپی اطلاعات!');
            }
            document.body.removeChild(textArea);
        }

        // Toggle Status Between New and Reviewed
        async function toggleStatus(id, newStatus) {
            try {
                if (_supabase) {
                    const { error } = await _supabase
                        .from('recruits')
                        .update({ status: newStatus })
                        .eq('id', id);

                    if (error) throw error;
                }
                
                const item = applicationsList.find(a => String(a.id) === String(id));
                if (item) item.status = newStatus;
                renderAdminList();

            } catch (err) {
                console.error("Error Updating Status:", err);
                alert("خطا در بروزرسانی وضعیت!");
            }
        }

        // Delete Applicant Record
        async function deleteApplicant(id) {
            if (!confirm("آیا از حذف این درخواست مطمئن هستید؟")) return;

            try {
                if (_supabase) {
                    const { error } = await _supabase
                        .from('recruits')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;
                }

                applicationsList = applicationsList.filter(a => String(a.id) !== String(id));
                renderAdminList();

            } catch (err) {
                console.error("Error Deleting:", err);
                alert("خطا در حذف درخواست!");
            }
        }

        // Helper Utility Functions
        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const date = new Date(dateStr);
                return new Intl.DateTimeFormat('fa-IR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(date);
            } catch (e) {
                return '';
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Initialize Form State
        selectMessenger('telegram');
        selectDevice('PC');
    </script>
</body>
</html>
